<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c0c0e">
    <title>H2O Owner · Live Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --owner-pad: max(1rem, env(safe-area-inset-left));
        }
        body.owner-body {
            margin: 0;
            min-height: 100dvh;
            background:
                radial-gradient(ellipse 80% 50% at 10% -10%, rgba(197, 168, 128, 0.12), transparent),
                radial-gradient(ellipse 60% 40% at 100% 0%, rgba(80, 60, 40, 0.25), transparent),
                #080809;
            color: var(--text-primary, #f5f5f5);
        }
        .owner-shell {
            max-width: 520px;
            margin: 0 auto;
            padding: 1.25rem var(--owner-pad) 3rem;
        }
        .owner-brand {
            font-family: "Playfair Display", serif;
            font-size: 1.75rem;
            letter-spacing: 0.02em;
            margin: 0 0 0.25rem;
        }
        .owner-brand span { color: var(--primary-gold, #c5a880); }
        .owner-sub {
            color: var(--text-secondary, #9a9aa0);
            font-size: 0.85rem;
            margin: 0 0 1.5rem;
        }
        .owner-card {
            background: rgba(12, 12, 14, 0.9);
            border: 1px solid rgba(197, 168, 128, 0.18);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 1rem;
        }
        .owner-card h2 {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--primary-gold, #c5a880);
            margin: 0 0 0.85rem;
            font-weight: 600;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }
        .kpi {
            background: #050506;
            border-radius: 8px;
            padding: 0.85rem;
        }
        .kpi .label {
            font-size: 0.7rem;
            color: #8a8a90;
            margin-bottom: 0.35rem;
        }
        .kpi .value {
            font-size: 1.25rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .owner-row {
            display: flex;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.55rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            font-size: 0.88rem;
        }
        .owner-row:last-child { border-bottom: none; }
        .muted { color: #8a8a90; font-size: 0.78rem; }
        .owner-login label {
            display: block;
            font-size: 0.75rem;
            color: #9a9aa0;
            margin-bottom: 0.35rem;
        }
        .owner-login input {
            width: 100%;
            box-sizing: border-box;
            background: #050506;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #f5f5f5;
            padding: 0.75rem 0.9rem;
            margin-bottom: 0.9rem;
            font-size: 1rem;
        }
        .owner-actions {
            display: flex;
            gap: 0.6rem;
            flex-wrap: wrap;
            margin: 0.5rem 0 1.25rem;
        }
        .owner-actions .btn { flex: 1; min-width: 120px; text-align: center; font-size: 0.8rem; padding: 0.65rem 0.9rem; }
        .owner-error {
            color: #f87171;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            display: none;
        }
        .owner-meta {
            font-size: 0.72rem;
            color: #6b6b72;
            margin-top: 0.5rem;
        }
        .empty-hint { color: #6b6b72; font-size: 0.85rem; padding: 0.25rem 0; }
        #dash-view { display: none; }
        #login-view { display: block; }
    </style>
</head>
<body class="owner-body">
    <div class="owner-shell">
        <h1 class="owner-brand">H2O<span>.</span></h1>
        <p class="owner-sub">Owner dashboard · today · read-only</p>

        <div id="login-view" class="owner-card owner-login">
            <h2>Manager sign-in</h2>
            <p class="muted" style="margin-top:0;margin-bottom:1rem;">Use a Manager account (e.g. jishnu / 9999). Cashiers cannot open this view.</p>
            <div class="owner-error" id="login-error"></div>
            <label for="owner-user">Username</label>
            <input id="owner-user" autocomplete="username" value="jishnu" />
            <label for="owner-pin">PIN</label>
            <input id="owner-pin" type="password" inputmode="numeric" autocomplete="current-password" />
            <button class="btn btn-gold" style="width:100%;font-size:0.9rem;" id="btn-owner-login">Sign in</button>
            <p class="owner-meta"><a href="index.html" style="color:#c5a880;">← Back to storefront / POS</a></p>
        </div>

        <div id="dash-view">
            <div class="owner-actions">
                <button class="btn btn-gold" id="btn-refresh"><i class="fas fa-sync-alt"></i> Refresh</button>
                <button class="btn btn-outline" id="btn-logout">Sign out</button>
            </div>
            <div class="owner-error" id="dash-error"></div>

            <div class="owner-card">
                <h2>Today</h2>
                <div class="kpi-grid">
                    <div class="kpi"><div class="label">Gross sales</div><div class="value" id="kpi-sales">—</div></div>
                    <div class="kpi"><div class="label">Tax (CGST+SGST)</div><div class="value" id="kpi-tax">—</div></div>
                    <div class="kpi"><div class="label">Tickets</div><div class="value" id="kpi-tx">—</div></div>
                    <div class="kpi"><div class="label">Staff commission</div><div class="value" id="kpi-comm">—</div></div>
                </div>
                <p class="owner-meta" id="generated-at"></p>
            </div>

            <div class="owner-card">
                <h2>By staff</h2>
                <div id="by-employee"></div>
            </div>

            <div class="owner-card">
                <h2>Low stock (&lt; 10)</h2>
                <div id="low-stock"></div>
            </div>

            <div class="owner-card">
                <h2>Dead stock (30d+)</h2>
                <div id="dead-stock"></div>
            </div>

            <p class="owner-meta"><a href="index.html" style="color:#c5a880;">Open full POS</a></p>
        </div>
    </div>

    <script src="config.js"></script>
    <script>
        const API = (window.H2O_API_BASE_URL || 'http://localhost:5000/api').replace(/\/$/, '');
        const TOKEN_KEY = 'h2o_pos_token';

        function inr(n) {
            const v = Number(n || 0);
            return '₹' + v.toLocaleString('en-IN', { maximumFractionDigits: 0 });
        }

        function authHeaders() {
            const token = localStorage.getItem(TOKEN_KEY);
            return {
                'Content-Type': 'application/json',
                Authorization: token ? `Bearer ${token}` : ''
            };
        }

        function showError(el, msg) {
            el.style.display = msg ? 'block' : 'none';
            el.textContent = msg || '';
        }

        function setViews(loggedIn) {
            document.getElementById('login-view').style.display = loggedIn ? 'none' : 'block';
            document.getElementById('dash-view').style.display = loggedIn ? 'block' : 'none';
        }

        function renderList(el, rows, mapFn, empty) {
            if (!rows || !rows.length) {
                el.innerHTML = `<p class="empty-hint">${empty}</p>`;
                return;
            }
            el.innerHTML = rows.map(mapFn).join('');
        }

        async function loadDashboard() {
            const errEl = document.getElementById('dash-error');
            showError(errEl, '');
            try {
                const res = await fetch(`${API}/owner/dashboard`, { headers: authHeaders() });
                const data = await res.json().catch(() => ({}));
                if (res.status === 401 || res.status === 403) {
                    localStorage.removeItem(TOKEN_KEY);
                    setViews(false);
                    showError(document.getElementById('login-error'), data.error || 'Manager login required');
                    return;
                }
                if (!res.ok) throw new Error(data.error || 'Failed to load');

                const s = data.summary || {};
                document.getElementById('kpi-sales').textContent = inr(s.gross_sales);
                document.getElementById('kpi-tax').textContent = inr(s.total_tax);
                document.getElementById('kpi-tx').textContent = String(s.tx_count || 0);
                document.getElementById('kpi-comm').textContent = inr(s.commission);
                document.getElementById('generated-at').textContent =
                    data.generatedAt ? `Updated ${new Date(data.generatedAt).toLocaleString('en-IN')}` : '';

                renderList(
                    document.getElementById('by-employee'),
                    data.byEmployee,
                    (r) => `<div class="owner-row"><span>${r.name}</span><span>${inr(r.sales)} · ${r.tx_count} tx · comm ${inr(r.commission)}</span></div>`,
                    'No paid sales yet today.'
                );
                renderList(
                    document.getElementById('low-stock'),
                    data.lowStock,
                    (r) => `<div class="owner-row"><span>${r.perfume} <span class="muted">${r.size || ''} ${r.sku || ''}</span></span><span>${r.qty}</span></div>`,
                    'No low-stock SKUs.'
                );
                renderList(
                    document.getElementById('dead-stock'),
                    data.deadStock,
                    (r) => `<div class="owner-row"><span>${r.perfume} <span class="muted">${r.size || ''}</span></span><span>${r.qty} · ${r.batch_age_days || '?'}d</span></div>`,
                    'No dead stock flagged.'
                );
                setViews(true);
            } catch (e) {
                showError(errEl, e.message || 'Network error');
            }
        }

        async function login() {
            const errEl = document.getElementById('login-error');
            showError(errEl, '');
            const username = document.getElementById('owner-user').value.trim();
            const pin = document.getElementById('owner-pin').value;
            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, pin })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    showError(errEl, data.error || 'Login failed');
                    return;
                }
                const role = String((data.user && data.user.role) || '').toLowerCase();
                if (role !== 'manager' && !role.includes('owner')) {
                    showError(errEl, 'Manager / Owner role required');
                    return;
                }
                localStorage.setItem(TOKEN_KEY, data.token);
                document.getElementById('owner-pin').value = '';
                await loadDashboard();
            } catch (e) {
                showError(errEl, 'API unreachable');
            }
        }

        document.getElementById('btn-owner-login').addEventListener('click', login);
        document.getElementById('owner-pin').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('btn-refresh').addEventListener('click', loadDashboard);
        document.getElementById('btn-logout').addEventListener('click', () => {
            localStorage.removeItem(TOKEN_KEY);
            setViews(false);
        });

        if (localStorage.getItem(TOKEN_KEY)) {
            loadDashboard();
        }
    </script>
</body>
</html>
